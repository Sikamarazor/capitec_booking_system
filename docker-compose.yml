name: branchbooking

x-db-connection: &db-connection >-
  Host=db;Port=5432;Database=${POSTGRES_DB:-branchbooking};Username=${POSTGRES_USER:-branchbooking};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-branchbooking}
      POSTGRES_DB: ${POSTGRES_DB:-branchbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BranchBooking: *db-connection
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__BranchBooking: *db-connection
      Notifications__Channel: ${NOTIFICATIONS_CHANNEL:-Simulated}
      Notifications__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8080}
      Notifications__Smtp__Host: ${SMTP_HOST:-mailpit}
      Notifications__Smtp__Port: ${SMTP_PORT:-1025}
      Notifications__Smtp__Security: ${SMTP_SECURITY:-None}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__SenderEmail: ${SMTP_SENDER_EMAIL:-noreply@branchbooking.example}
      Notifications__Smtp__SenderName: ${SMTP_SENDER_NAME:-BranchBooking}
      Notifications__Reminders__Enabled: ${REMINDERS_ENABLED:-true}
      Notifications__Reminders__MinimumGapHours: ${REMINDERS_GAP_HOURS:-4}

    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
  
    # Development mail catcher: accepts every message, delivers none, shows them at http://localhost:8025.
  # Started only with: docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:latest   # record the version you ran in the verification record; pin it if you keep it
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP, so a Worker started outside Docker can reach it too
      - "127.0.0.1:8025:8025"   # web page and API


volumes:
  db-data:
