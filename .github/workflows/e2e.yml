name: E2E

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the stack and run the browser tests
        run: scripts/e2e.sh

      - name: Keep the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/compose.log
          retention-days: 7
          if-no-files-found: ignore
