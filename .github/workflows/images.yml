name: Images

on:
  pull_request:
    paths:
      - docker/**
      - src/**
      - frontend/**
      - deploy/**
      - docker-compose*.yml
      - .dockerignore
      - .hadolint.yaml
      - scripts/ci/check-image.sh
      - scripts/ci/tests/nginx-dns.test.sh
      - global.json
      - Directory.Build.props
      - .github/workflows/images.yml

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: Image ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/${{ matrix.component }}.Dockerfile
          config: .hadolint.yaml

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          load: true
          tags: branchbooking-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Check what is inside
        run: scripts/ci/check-image.sh ${{ matrix.component }} branchbooking-${{ matrix.component }}:ci

      - name: Web survives API DNS outages
        if: matrix.component == 'web'
        run: scripts/ci/tests/nginx-dns.test.sh branchbooking-web:ci

      - name: Report known vulnerabilities (does not block pull requests)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: branchbooking-${{ matrix.component }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
