# Runs a published BranchBooking release on one host. Copy this file and .env.release.example to the host,
# rename the example to .env, fill every value, then: docker compose -f docker-compose.release.yml up -d
# TLS is not handled here: put a reverse proxy or load balancer with HTTPS in front of the web port.
name: branchbooking

x-db-connection: &db-connection >-
  Host=db;Port=5432;Database=${POSTGRES_DB:-branchbooking};Username=${POSTGRES_USER:-branchbooking};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-branchbooking}
      POSTGRES_DB: ${POSTGRES_DB:-branchbooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER in .env}/branchbooking-api:${BRANCHBOOKING_VERSION:?Set BRANCHBOOKING_VERSION in .env}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BranchBooking: *db-connection
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-false}
      # nginx is the only client of the API, so the customer's address comes from its X-Forwarded-For.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER in .env}/branchbooking-worker:${BRANCHBOOKING_VERSION:?Set BRANCHBOOKING_VERSION in .env}
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__BranchBooking: *db-connection
      Notifications__Channel: ${NOTIFICATIONS_CHANNEL:-Simulated}
      Notifications__PublicBaseUrl: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env (the address customers use)}
      Notifications__BrandName: ${BRAND_NAME:-BranchBooking}
      Notifications__Smtp__Host: ${SMTP_HOST:-mailpit}
      Notifications__Smtp__Port: ${SMTP_PORT:-1025}
      Notifications__Smtp__Security: ${SMTP_SECURITY:-None}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__SenderEmail: ${SMTP_SENDER_EMAIL:-noreply@branchbooking.example}
      Notifications__Smtp__SenderName: ${SMTP_SENDER_NAME:-BranchBooking}
      Notifications__Reminders__Enabled: ${REMINDERS_ENABLED:-true}
      Notifications__Reminders__MinimumGapHours: ${REMINDERS_GAP_HOURS:-4}
    depends_on:
      db:
        condition: service_healthy

  # Demo mail catcher: accepts every message, delivers none. Only with: docker compose --profile mail up -d
  # Its page is bound to this machine only. Do not use it for real customers (they would receive nothing).
  mailpit:
    image: axllent/mailpit:latest   # pin the version you tested
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  web:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER in .env}/branchbooking-web:${BRANCHBOOKING_VERSION:?Set BRANCHBOOKING_VERSION in .env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  db-data:
